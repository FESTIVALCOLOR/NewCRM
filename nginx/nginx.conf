events {
    worker_connections 1024;
}

# SNI-маршрутизация: порт 443 делится между CRM (crm.festivalcolor.ru) и VPN (www.microsoft.com)
# ssl_preread читает SNI ДО терминации TLS и роутит TCP-поток без расшифровки
stream {
    map $ssl_preread_server_name $backend {
        crm.festivalcolor.ru   127.0.0.1:8444;   # → nginx HTTPS (CRM)
        www.microsoft.com      172.18.0.1:8443;  # → Xray Reality (VPN)
        default                127.0.0.1:8444;   # всё остальное → CRM
    }

    server {
        listen 443;
        proxy_pass $backend;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
        proxy_buffer_size 16k;
    }
}

http {
    upstream api {
        server api:8000;
    }

    # Log format: маскируем query string когда есть token= (защита JWT от утечки в логах)
    map $request_uri $masked_uri {
        ~^([^?]+)\?.*token=  $1?[params-masked];
        default                $request_uri;
    }
    log_format masked '$remote_addr - [$time_local] '
                      '"$request_method $masked_uri $server_protocol" '
                      '$status $body_bytes_sent';

    # Редирект с HTTP на HTTPS
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }

        # Для Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # Скрыть версию Nginx
    server_tokens off;

    # HTTPS
    server {
        listen 8444 ssl http2;  # внутренний порт; снаружи трафик приходит через stream:443
        server_name _;

        # SSL сертификаты (Let's Encrypt)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://crm.festivalcolor.ru wss://crm.festivalcolor.ru blob:; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:; media-src 'self' blob: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Размер загружаемых файлов
        client_max_body_size 700M;

        # MIME типы
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 1000;

        # Загрузка файлов на ЯД — увеличенные таймауты (файл до 600 МБ)
        location = /api/v1/files/upload {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_body_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # API — проксирование к FastAPI (ПЕРЕД статикой!)
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket
        location /api/v1/ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket таймауты (длинные для persistent connections)
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # VLESS WebSocket (Xray) — личный VPN, только WebSocket-соединения
        # Xray слушает на 172.18.0.1:10086 (Docker bridge, недоступен из интернета)
        location = /ray {
            if ($http_upgrade != "websocket") { return 404; }
            proxy_pass http://172.18.0.1:10086;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            access_log off;
        }

        # PWA статика — Service Worker и manifest
        location /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        location /manifest.json {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # .mjs файлы (ES modules, например pdf.worker.min.mjs) — правильный MIME type
        location ~* \.mjs$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            types { }
            default_type application/javascript;
        }

        # PWA статика — assets с долгим кэшем
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # PWA иконки
        location /icons/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public";
        }

        # index.html — без кэша (чтобы SW обновлялся)
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # PWA — все остальные маршруты → index.html (SPA fallback)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            # HTML файлы — без кэша
            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        # Логи (masked_uri убирает ?token=... из access log)
        access_log /var/log/nginx/access.log masked;
        error_log /var/log/nginx/error.log;
    }
}
